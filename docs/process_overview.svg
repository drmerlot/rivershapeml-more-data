<svg xmlns="http://www.w3.org/2000/svg" width="680" height="708" viewBox="0 0 680 708" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Analysis process overview</title>
<desc>Sources (USGS Water Data APIs, RiverShapeML research repo, NOAA deployment repo, reference products) feed five steps: expanded training set, data checks, retrain and evaluate, re-predict 2.65M reaches with prediction intervals, compare and check; ending in the deliverables.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.src rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.src .h { fill: #444441; } .src .s { fill: #5F5E5A; }
.step rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.step .h { fill: #085041; } .step .s { fill: #0F6E56; }
.h { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
.s { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
.arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>
</defs>
<rect width="680" height="708" fill="#ffffff"/>

<g class="src"><rect x="40" y="40" width="240" height="116" rx="8"/>
<text class="h" x="160" y="62">USGS Water Data APIs</text>
<text class="s" x="160" y="86">channel-measurements (4.8M)</text>
<text class="s" x="160" y="104">peaks · monitoring-locations</text>
<text class="s" x="160" y="122">time-series-metadata</text>
<text class="s" x="160" y="140">NLDI (gage → NHDPlus reach)</text></g>

<g class="src"><rect x="40" y="176" width="240" height="84" rx="8"/>
<text class="h" x="160" y="198">RiverShapeML research repo</text>
<text class="s" x="160" y="222">lynker-spatial/RiverShapeML</text>
<text class="s" x="160" y="240">HYDRoSWOT, training sites</text></g>

<g class="src"><rect x="40" y="280" width="240" height="100" rx="8"/>
<text class="h" x="160" y="302">NOAA deployment repo</text>
<text class="s" x="160" y="326">NOAA-OWP/predict-riverML</text>
<text class="s" x="160" y="344">ml_inputs (2.65M reaches)</text>
<text class="s" x="160" y="362">XGBoost models, settings</text></g>

<g class="src"><rect x="40" y="400" width="240" height="130" rx="8"/>
<text class="h" x="160" y="422">Reference products</text>
<text class="s" x="160" y="446">HydroShare 2024 release</text>
<text class="s" x="160" y="464">(Modaresi Rad et al.)</text>
<text class="s" x="160" y="482">USGS bankfull geometry</text>
<text class="s" x="160" y="500">(Bieger et al. 2015)</text>
<text class="s" x="160" y="518">E2NHDPlusV2 attributes</text></g>

<g class="step"><rect x="310" y="120" width="220" height="56" rx="8"/>
<text class="h" x="420" y="138">Expanded training set</text>
<text class="s" x="420" y="158">y for ~7,000 gage sites</text></g>

<g class="step"><rect x="310" y="210" width="220" height="56" rx="8"/>
<text class="h" x="420" y="228">Data checks</text>
<text class="s" x="420" y="248">Is the added data sound?</text></g>

<g class="step"><rect x="310" y="302" width="220" height="56" rx="8"/>
<text class="h" x="420" y="320">Retrain and evaluate</text>
<text class="s" x="420" y="340">Same x and f, more rows</text></g>

<g class="step"><rect x="310" y="392" width="220" height="56" rx="8"/>
<text class="h" x="420" y="410">Re-predict 2.65M reaches</text>
<text class="s" x="420" y="430">With prediction intervals</text></g>

<g class="step"><rect x="310" y="482" width="220" height="56" rx="8"/>
<text class="h" x="420" y="500">Compare and check</text>
<text class="s" x="420" y="520">vs current, 2024, Bieger</text></g>

<g class="src"><rect x="290" y="572" width="260" height="96" rx="8"/>
<text class="h" x="420" y="592">Deliverables</text>
<text class="s" x="420" y="614">ML-derived channel width</text>
<text class="s" x="420" y="632">and depth, expanded-set retrain;</text>
<text class="s" x="420" y="650">explorer, repo, memo</text></g>

<line class="arr" x1="280" y1="134" x2="306" y2="134" marker-end="url(#arrow)"/>
<path class="arr" d="M280 200 L294 200 L294 164 L306 164" marker-end="url(#arrow)"/>
<line class="arr" x1="280" y1="238" x2="306" y2="238" marker-end="url(#arrow)"/>
<line class="arr" x1="280" y1="330" x2="306" y2="330" marker-end="url(#arrow)"/>
<path class="arr" d="M280 368 L294 368 L294 420 L306 420" marker-end="url(#arrow)"/>
<line class="arr" x1="280" y1="510" x2="306" y2="510" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="176" x2="420" y2="206" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="266" x2="420" y2="298" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="358" x2="420" y2="388" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="448" x2="420" y2="478" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="538" x2="420" y2="568" marker-end="url(#arrow)"/>
</svg>
